name: Atualizar jogos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Consultar agenda da ESPN
        run: node scripts/atualizar-jogos.mjs

      - name: Publicar nova agenda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/jogos.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza agenda esportiva da ESPN"
          git push
